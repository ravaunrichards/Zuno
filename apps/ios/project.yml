name: ZUNO
options:
  bundleIdPrefix: com.zuno
  xcodeVersion: "16.0"
  projectFormat: xcode16_0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  ZUNO:
    type: application
    platform: iOS
    sources:
      - path: ZunoApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zuno.app
        INFOPLIST_KEY_CFBundleDisplayName: ZUNO
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
